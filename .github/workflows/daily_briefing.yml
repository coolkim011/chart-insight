name: 24/7 Market Briefing Crawler (Every 20 Min)

on:
  schedule:
    # 24시간 내내 20분마다 자동 실행
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 이전 실행이 끝나기 전에 다음 실행이 겹쳐 같은 파일을 덮어쓰지 않도록 순서대로 실행
concurrency:
  group: briefing-crawler
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser anthropic google-genai

      - name: Collect new news (publish before AI analysis)
        run: |
          python us_market_crawler.py collect

      - name: Commit and Push new news
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: new market news [skip ci]" && git push)

      - name: Analyze pending news with AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python us_market_crawler.py analyze

      - name: Commit and Push analysis
        run: |
          git add public/briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 24/7 AI market briefing update [skip ci]" && git push)